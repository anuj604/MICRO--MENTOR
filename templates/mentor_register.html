<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply as Mentor - MicroMentor</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .apply-card {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            border-radius: 8px;
            padding: 35px 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: 1px solid #e1e4e8;
        }

        .header-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-logo h1 {
            font-size: 24px;
            font-weight: bold;
            color: #1a73e8;
            margin-bottom: 4px;
        }

        .header-logo p {
            font-size: 14px;
            color: #666;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 4px;
        }

        .form-control {
            font-size: 14px;
            padding: 9px 12px;
            border-radius: 5px;
        }

        .form-control:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 0.2rem rgba(26, 115, 232, 0.15);
        }

        .btn-submit {
            background-color: #1a73e8;
            border-color: #1a73e8;
            font-weight: bold;
            padding: 10px;
            font-size: 15px;
        }

        .btn-submit:hover {
            background-color: #1558b0;
            border-color: #1558b0;
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .footer-links a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="apply-card">
    <div class="header-logo">
        <h1>MicroMentor</h1>
        <p>👨‍🏫 Mentor Application & Onboarding</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 px-3 small text-center" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="username">Username *</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="e.g. john_mentor" required autofocus>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="password">Password *</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Create password" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-7 mb-3">
                <label class="form-label" for="skill">Primary Skill / Domain *</label>
                <input type="text" class="form-control" id="skill" name="skill" placeholder="e.g. Python, Django, React" value="{{ skill|default:'' }}" required>
            </div>
            <div class="col-md-5 mb-3">
                <label class="form-label" for="experience">Experience (Years) *</label>
                <input type="number" class="form-control" id="experience" name="experience" min="1" max="50" placeholder="e.g. 3" value="{{ experience|default:'2' }}" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="expertise">Short Bio / Expertise Summary *</label>
            <textarea class="form-control" id="expertise" name="expertise" rows="2" placeholder="Briefly describe your background and how you can guide students..." required>{{ expertise|default:'' }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label" for="phone">Phone / Contact (Optional)</label>
            <input type="text" class="form-control" id="phone" name="phone" placeholder="e.g. +91 98765 43210" value="{{ phone|default:'' }}">
            <div class="form-text text-muted" style="font-size: 11px;">Visible to students only after you accept their booking.</div>
        </div>

        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary btn-submit">Submit Mentor Registration</button>
        </div>
    </form>

    <div class="footer-links">
        <div>Looking to learn instead? <a href="/">Register as Student</a></div>
        <div class="mt-1">Already registered? <a href="/login/">Login here</a></div>
    </div>
</div>

</body>
</html>
