<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>

    <style>
        body {
            font-family: 'Segoe UI';
            background: linear-gradient(to right, #667eea, #764ba2);
        }

        .container {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #667eea;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
            width: 100%;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Edit Profile</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" value="{{ user.username }}">

        <button type="submit">Save Changes</button>
    </form>
</div>

</body>
</html>
